name: telemed-ia-patient-management-db

services:
  patients-db:
    image: postgres:16
    container_name: patients-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PATIENT_DB_NAME:-telemed_patient_db}
      POSTGRES_USER: ${PATIENT_DB_USER:-telemed_patient_user}
      POSTGRES_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
    volumes:
      - patients_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PATIENT_DB_USER:-telemed_patient_user} -d ${PATIENT_DB_NAME:-telemed_patient_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    networks:
      - platform

  patients-db-migrate:
    image: flyway/flyway:10.20.1
    container_name: patients-db-migrate
    profiles: [tooling]
    depends_on:
      patients-db:
        condition: service_healthy
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    environment:
      FLYWAY_URL: jdbc:postgresql://patients-db:5432/${PATIENT_DB_NAME:-telemed_patient_db}
      FLYWAY_USER: ${PATIENT_DB_USER:-telemed_patient_user}
      FLYWAY_PASSWORD: ${PATIENT_DB_PASSWORD:?PATIENT_DB_PASSWORD is required}
    command: ["-configFiles=flyway.toml", "migrate"]
    networks:
      - platform

volumes:
  patients_db_data:

networks:
  platform:
    external: true
    name: platform