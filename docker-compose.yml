services:
  postgres:
    image: postgres:16-alpine
    container_name: telemed-patient-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemed_patient_db}
      POSTGRES_USER: ${POSTGRES_USER:-telemed_patient_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemed_patient_password}
    ports:
      - "5432:5432"
    volumes:
      - telemed-patient-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemed_patient_user} -d ${POSTGRES_DB:-telemed_patient_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10-alpine
    container_name: telemed-patient-flyway
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-telemed_patient_db}
      -user=${POSTGRES_USER:-telemed_patient_user}
      -password=${POSTGRES_PASSWORD:-telemed_patient_password}
      -locations=filesystem:/flyway/sql
      -baselineOnMigrate=true
      migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro

  # Dev-only seed. Runs AFTER flyway has created the schema.
  seed:
    image: postgres:16-alpine
    container_name: telemed-patient-seed
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-telemed_patient_password}
    volumes:
      - ./docker/db/seed:/seed:ro
    entrypoint:
      - "sh"
      - "-c"
      - "psql -h postgres -U ${POSTGRES_USER:-telemed_patient_user} -d ${POSTGRES_DB:-telemed_patient_db} -v ON_ERROR_STOP=1 -f /seed/01-dev-seed.sql"
    restart: "no"

volumes:
  telemed-patient-pgdata:
    driver: local